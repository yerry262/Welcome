    <style>
      /* ---- animated project icons ---- */
      .big-link-icon svg {
        width: 48px;
        height: 48px;
        display: block;
        overflow: visible;
      }
      .big-link-icon svg :is(g, circle, rect, path) {
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }

      /* Spotify: bump to the beat */
      @keyframes sp-bump {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
      }
      .big-link:hover .icon-spotify svg {
        animation: sp-bump 0.45s ease-in-out infinite;
        filter: drop-shadow(0 0 8px #1db954);
      }

      /* Tesla: wind up, drift two donuts, wobble to a stop */
      @keyframes tsla-drift {
        0% { transform: rotate(0deg); }
        18% { transform: rotate(-35deg); }
        70% { transform: rotate(695deg); }
        85% { transform: rotate(738deg); }
        100% { transform: rotate(720deg); }
      }
      .big-link:hover .icon-tesla svg {
        animation: tsla-drift 1.1s cubic-bezier(0.25, 0.1, 0.25, 1) both;
        filter: drop-shadow(0 0 8px #e82127);
      }

      /* Brick Breaker: ball bounces, brick shatters */
      @keyframes bb-ball {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-9px); }
      }
      @keyframes bb-brick {
        0%, 40% { opacity: 1; transform: scale(1); }
        52% { opacity: 0; transform: scale(1.5); }
        100% { opacity: 0; transform: scale(1.5); }
      }
      .big-link:hover .bb-ball { animation: bb-ball 0.6s ease-in-out infinite; }
      .big-link:hover .bb-brick-hit { animation: bb-brick 0.6s ease-out forwards; }

      /* Connect4: disc drops in and bounces */
      @keyframes c4-drop {
        0% { transform: translateY(-16px); }
        60% { transform: translateY(0); }
        75% { transform: translateY(-3px); }
        100% { transform: translateY(0); }
      }
      .big-link:hover .c4-drop { animation: c4-drop 0.8s ease-in; }

      /* Home Run Derby: gone. out of the park. fresh pitch comes back */
      @keyframes hr-fly {
        0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
        38% { transform: translate(17px, -17px) rotate(720deg); opacity: 1; }
        42% { transform: translate(20px, -20px) rotate(720deg); opacity: 0; }
        55% { transform: translate(-9px, 9px) rotate(0deg); opacity: 0; }
        70% { transform: translate(-4px, 4px) rotate(0deg); opacity: 1; }
        100% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
      }
      .big-link:hover .hr-ball { animation: hr-fly 1.3s ease-in-out; }

      /* Real Estate: lights on, door opens, chimney smokes */
      .re-win { opacity: 0.5; }
      @keyframes re-glow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px #ffd700); }
      }
      .big-link:hover .re-win { animation: re-glow 0.9s ease-in-out infinite; }
      .big-link:hover .re-win2 { animation-delay: 0.3s; }
      @keyframes re-door {
        to { transform: scaleX(0.25); }
      }
      .big-link:hover .re-door {
        animation: re-door 0.5s ease-out forwards;
        transform-origin: 0% 50%;
      }
      .re-smoke { opacity: 0; }
      @keyframes re-smoke {
        0% { transform: translateY(0); opacity: 0; }
        30% { opacity: 0.7; }
        100% { transform: translateY(-4px); opacity: 0; }
      }
      .big-link:hover .re-smoke { animation: re-smoke 1.2s ease-out infinite; }
      .big-link:hover .re-smoke2 { animation-delay: 0.4s; }
      .big-link:hover .re-smoke3 { animation-delay: 0.8s; }

      /* ChainChat: typing… */
      @keyframes cc-dot {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-2.5px); }
      }
      .big-link:hover .cc-dot { animation: cc-dot 0.9s ease-in-out infinite; }
      .big-link:hover .cc-dot2 { animation-delay: 0.15s; }
      .big-link:hover .cc-dot3 { animation-delay: 0.3s; }

      /* Stream: scanline sweep + play pulse */
      .st-sweep { opacity: 0; }
      @keyframes st-sweep {
        0% { transform: translateX(0); opacity: 0; }
        15% { opacity: 0.4; }
        85% { opacity: 0.4; }
        100% { transform: translateX(16px); opacity: 0; }
      }
      @keyframes st-play {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.3); }
      }
      .big-link:hover .st-sweep { animation: st-sweep 1s linear infinite; }
      .big-link:hover .st-play { animation: st-play 0.8s ease-in-out infinite; }

      /* Blood: liquid wobble + drip falling in */
      @keyframes bl-wobble {
        0%, 100% { transform: scale(1.07, 0.93); }
        50% { transform: scale(0.94, 1.06); }
      }
      .big-link:hover .bl-drop {
        animation: bl-wobble 0.4s ease-in-out infinite;
        transform-origin: 50% 100%;
      }
      .bl-drip { opacity: 0; }
      @keyframes bl-drip {
        0% { transform: translateY(0); opacity: 0; }
        30% { opacity: 1; }
        100% { transform: translateY(7px); opacity: 0; }
      }
      .big-link:hover .bl-drip { animation: bl-drip 0.8s ease-in infinite; }

      /* About Me: wave hello */
      @keyframes am-wave {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(20deg); }
        75% { transform: rotate(-14deg); }
      }
      .big-link:hover .am-arm {
        animation: am-wave 0.7s ease-in-out infinite;
        transform-origin: 10% 90%;
      }

      /* GitHub: coin flip */
      @keyframes gh-flip {
        from { transform: rotateY(0deg); }
        to { transform: rotateY(360deg); }
      }
      .big-link:hover .icon-github svg { animation: gh-flip 0.9s ease both; }

      @media (prefers-reduced-motion: reduce) {
        .big-link-icon svg,
        .big-link-icon svg * {
          animation: none !important;
        }
      }
